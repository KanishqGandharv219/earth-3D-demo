<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majestic Earth 3D — Spectacular Edition</title>
    <meta name="description"
        content="A stunning, photorealistic 3D Earth visualization with real textures, atmospheric glow, cloud layers, and interactive controls.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000;
            --accent-primary: #06b6d4;
            --accent-secondary: #8b5cf6;
            --text-primary: #f3f4f6;
            --text-dim: rgba(255, 255, 255, 0.5);
            --bg-elevated: rgba(8, 12, 24, 0.92);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-blur: blur(24px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* === Premium Loader === */
        #loader {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #0a0e1a 0%, #000 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .spinner-ring {
            width: 64px;
            height: 64px;
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-top: 2px solid var(--accent-primary);
            border-right: 2px solid var(--accent-secondary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            margin-bottom: 28px;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.2), inset 0 0 20px rgba(139, 92, 246, 0.1);
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #loading-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--accent-primary);
            text-transform: uppercase;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            50% {
                opacity: 0.5;
            }
        }

        #loading-progress {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1px;
            margin-top: 16px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 1px;
            transition: width 0.3s ease;
        }

        #error-report {
            color: #ef4444;
            font-size: 0.7rem;
            margin-top: 20px;
            max-width: 80%;
            text-align: center;
            font-family: 'Fira Code', monospace;
            line-height: 1.6;
        }

        #protocol-alert {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-top: 16px;
            display: none;
            max-width: 420px;
            text-align: center;
        }

        #force-enter {
            margin-top: 28px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            display: none;
            transition: all 0.3s ease;
            font-family: 'Fira Code', monospace;
        }

        #force-enter:hover {
            background: rgba(6, 182, 212, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* === HUD === */
        #fps-monitor {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 14px;
            background: var(--bg-elevated);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 10px;
            color: var(--text-dim);
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            z-index: 100;
            pointer-events: none;
            border-left: 3px solid var(--accent-primary);
        }

        #info-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 18px;
            background: var(--bg-elevated);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: 12px;
            z-index: 100;
            pointer-events: none;
        }

        #info-badge h1 {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #info-badge p {
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* === lil-gui premium overrides === */
        .lil-gui {
            z-index: 200;
            --font-family: 'Inter', sans-serif;
        }

        .lil-gui .title {
            font-weight: 600 !important;
            letter-spacing: 0.5px !important;
        }
    </style>

    <!-- Three.js r128 + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>
</head>

<body>
    <div id="loader">
        <div class="spinner-ring"></div>
        <div id="loading-text">INITIALIZING PLANETARY ENGINE...</div>
        <div id="loading-progress">
            <div id="loading-bar"></div>
        </div>
        <div id="protocol-alert">
            <strong>SECURITY BLOCK DETECTED</strong><br>
            Running via <em>file://</em> protocol — browsers block textures.<br>
            <strong>Solution:</strong> Right-click index.html in VS Code → <strong>'Open with Live Server'</strong>.
        </div>
        <div id="error-report"></div>
        <button id="force-enter" onclick="enterScene()">PROCEED WITHOUT TEXTURES</button>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div id="fps-monitor">FPS: --</div>
    <div id="info-badge">
        <h1>EARTH</h1>
        <p>Real-time 3D Visualization</p>
    </div>

    <script>
        /**
         * ═══════════════════════════════════════════════════════
         * SPECTACULAR EARTH 3D — Full Texture Pipeline
         * Normal Mapping · Specular Oceans · Cloud Layer
         * Atmospheric Glow · Realistic Rotation · Oblate Spheroid
         * ═══════════════════════════════════════════════════════
         */

        // ────── Configuration ──────
        const config = {
            rotationSpeed: 0.001,
            cloudSpeed: 0.0003,
            axialTilt: 23.44,
            autoRotate: true,
            atmosDayColor: '#4db8ff',
            atmosTwilightColor: '#ff6030',
            atmosIntensity: 0.5,
            glowStrength: 0.45,
            cloudOpacity: 0.37,
            showClouds: true,
            specularIntensity: 0.0,
            normalStrength: 1.0,
            sunIntensity: 1.0,
            sunAnimSpeed: 0.0,
            cameraFov: 45,
        };

        // ────── Scene Setup ──────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(config.cameraFov, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0.5, 5.5);

        const renderer = new THREE.WebGLRenderer({
            canvas: document.querySelector('#bg-canvas'),
            alpha: true,
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        // ────── OrbitControls ──────
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 0.8;
        controls.minDistance = 3;
        controls.maxDistance = 20;
        controls.enablePan = false;

        // ────── Loading System ──────
        const loadingText = document.getElementById('loading-text');
        const loadingBar = document.getElementById('loading-bar');
        const errorReport = document.getElementById('error-report');
        const enterBtn = document.getElementById('force-enter');
        const protocolAlert = document.getElementById('protocol-alert');

        if (window.location.protocol === 'file:') {
            protocolAlert.style.display = 'block';
            setTimeout(() => { enterBtn.style.display = 'block'; }, 1500);
        }

        const enterScene = () => {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 1200);
            }
        };

        const manager = new THREE.LoadingManager();
        let failedCount = 0;

        manager.onProgress = (url, loaded, total) => {
            const pct = Math.round((loaded / total) * 100);
            loadingText.innerText = `LOADING: ${url.split('/').pop()} (${pct}%)`;
            loadingBar.style.width = pct + '%';
        };

        manager.onLoad = () => {
            if (failedCount === 0) {
                loadingBar.style.width = '100%';
                setTimeout(enterScene, 400);
            } else {
                loadingText.innerText = "PARTIAL LOAD — TEXTURES FAILED";
                enterBtn.style.display = 'block';
            }
        };

        manager.onError = (url) => {
            failedCount++;
            console.error('❌ Texture failed:', url);
            errorReport.innerHTML += `FAILED: ${url.split('/').pop()}<br>`;
            enterBtn.style.display = 'block';
        };

        setTimeout(() => { enterBtn.style.display = 'block'; }, 5000);

        // ────── Texture Loading ──────
        const textureLoader = new THREE.TextureLoader(manager);

        const loadTex = (file, encoding = THREE.sRGBEncoding) => {
            const t = textureLoader.load(`assets/textures/${file}`);
            t.encoding = encoding;
            t.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return t;
        };

        const dayTexture = loadTex('day.jpg');
        const nightTexture = loadTex('night.jpg');
        const normalTexture = loadTex('normal.jpg', THREE.LinearEncoding);
        const specularTexture = loadTex('specular.jpg', THREE.LinearEncoding);
        const specularCloudsTexture = loadTex('specularClouds.jpg');

        // ────── Earth Shader Material ──────
        const earthMaterial = new THREE.ShaderMaterial({
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1,
            uniforms: {
                uDayTexture: { value: dayTexture },
                uNightTexture: { value: nightTexture },
                uNormalMap: { value: normalTexture },
                uSpecularMap: { value: specularTexture },
                uSpecularCloudsTexture: { value: specularCloudsTexture },
                uSunDirection: { value: new THREE.Vector3(0, 0, 1) },
                uAtmosphereDayColor: { value: new THREE.Color(config.atmosDayColor) },
                uAtmosphereTwilightColor: { value: new THREE.Color(config.atmosTwilightColor) },
                uAtmosIntensity: { value: config.atmosIntensity },
                uNormalStrength: { value: config.normalStrength },
                uSunIntensity: { value: config.sunIntensity },
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec3 vWorldNormal;
                varying vec3 vTangent;
                varying vec3 vBitangent;

                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);

                    // Robust tangent: pick a reference axis that won't be parallel to the normal
                    vec3 ref = abs(normal.y) < 0.999 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
                    vec3 tangent = normalize(cross(ref, normal));
                    tangent = normalize(normalMatrix * tangent);
                    vec3 bitangent = normalize(cross(vNormal, tangent));

                    vTangent = tangent;
                    vBitangent = bitangent;

                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vPosition = mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D uDayTexture;
                uniform sampler2D uNightTexture;
                uniform sampler2D uNormalMap;
                uniform sampler2D uSpecularMap;
                uniform sampler2D uSpecularCloudsTexture;
                uniform vec3 uSunDirection;
                uniform vec3 uAtmosphereDayColor;
                uniform vec3 uAtmosphereTwilightColor;
                uniform float uAtmosIntensity;
                uniform float uNormalStrength;
                uniform float uSunIntensity;

                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec3 vWorldNormal;
                varying vec3 vTangent;
                varying vec3 vBitangent;

                void main() {
                    vec3 viewDir = normalize(-vPosition);
                    vec3 sunDir = normalize(uSunDirection);

                    // ── Normal Mapping ──
                    vec3 normalMapSample = texture2D(uNormalMap, vUv).rgb * 2.0 - 1.0;
                    normalMapSample.xy *= uNormalStrength;
                    mat3 TBN = mat3(normalize(vTangent), normalize(vBitangent), normalize(vNormal));
                    vec3 perturbedNormal = normalize(TBN * normalMapSample);

                    // ── Textures ──
                    vec3 dayColor = texture2D(uDayTexture, vUv).rgb;
                    vec3 nightColor = texture2D(uNightTexture, vUv).rgb;
                    vec2 specCloud = texture2D(uSpecularCloudsTexture, vUv).rg;
                    float cloudStr = specCloud.g;

                    // ── Day/Night blend ──
                    float sunDot = dot(perturbedNormal, sunDir);
                    float dayMix = smoothstep(-0.15, 0.3, sunDot);

                    // Boost night city lights
                    vec3 nightGlow = nightColor * 1.5;
                    vec3 baseColor = mix(nightGlow, dayColor * uSunIntensity, dayMix);

                    // ── Cloud overlay ──
                    float cloudDay = cloudStr * dayMix * 0.85;
                    float cloudNight = cloudStr * (1.0 - dayMix) * 0.12;
                    baseColor = mix(baseColor, vec3(1.0), cloudDay);
                    baseColor += vec3(0.02, 0.03, 0.06) * cloudNight;

                    // ── Atmosphere Fresnel (subtle edge glow on the surface) ──
                    float fresnel = pow(clamp(1.0 - dot(viewDir, perturbedNormal), 0.0, 1.0), 4.0);
                    vec3 atmosColor = mix(uAtmosphereTwilightColor, uAtmosphereDayColor,
                                          smoothstep(-0.3, 0.6, sunDot));
                    baseColor += atmosColor * fresnel * uAtmosIntensity * 0.4;

                    gl_FragColor = vec4(baseColor, 1.0);
                }
            `
        });

        // ────── Earth Mesh (WGS84 oblate spheroid) ──────
        const earthGeometry = new THREE.SphereGeometry(2, 128, 128);
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        // WGS84 flattening: 1/298.257 → Y scale = 1 - 0.003353 = 0.99665
        earth.scale.set(1.0, 0.99665, 1.0);

        const earthGroup = new THREE.Group();
        earthGroup.add(earth);
        earthGroup.rotation.z = config.axialTilt * Math.PI / 180;
        scene.add(earthGroup);

        // ────── Cloud Layer (separate sphere) ──────
        const cloudMaterial = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            uniforms: {
                uCloudTexture: { value: specularCloudsTexture },
                uSunDirection: { value: new THREE.Vector3(0, 0, 1) },
                uOpacity: { value: config.cloudOpacity },
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    vPosition = mvPos.xyz;
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                uniform sampler2D uCloudTexture;
                uniform vec3 uSunDirection;
                uniform float uOpacity;
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vec3 sunDir = normalize(uSunDirection);
                    vec3 norm = normalize(vNormal);
                    float sunDot = dot(norm, sunDir);
                    float dayMix = smoothstep(-0.2, 0.4, sunDot);

                    float cloudAlpha = texture2D(uCloudTexture, vUv).g;
                    // Clouds are bright on day, faint on night
                    vec3 cloudColor = mix(vec3(0.03, 0.04, 0.07), vec3(1.0), dayMix);
                    float alpha = cloudAlpha * uOpacity;

                    gl_FragColor = vec4(cloudColor, alpha);
                }
            `
        });

        const cloudMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.05, 96, 96),
            cloudMaterial
        );
        cloudMesh.scale.set(1.0, 0.99665, 1.0);
        earthGroup.add(cloudMesh);

        // ────── Atmosphere Glow (thin bloom-like halo using additive blending) ──────
        const atmosGlowMaterial = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            uniforms: {
                uSunDirection: { value: new THREE.Vector3(0, 0, 1) },
                uGlowColor: { value: new THREE.Color(config.atmosDayColor) },
                uGlowStrength: { value: config.glowStrength },
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    vPosition = mvPos.xyz;
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                uniform vec3 uSunDirection;
                uniform vec3 uGlowColor;
                uniform float uGlowStrength;
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vec3 viewDir = normalize(-vPosition);
                    vec3 norm = normalize(vNormal);

                    // Sharp edge-only glow — falls off quickly toward center
                    float rim = 1.0 - abs(dot(viewDir, norm));
                    float intensity = pow(rim, 5.0) * uGlowStrength;

                    // Sun-side is blue, dark-side is very faint orange
                    float sunFactor = dot(norm, normalize(uSunDirection));
                    float sunBlend = smoothstep(-0.3, 0.6, sunFactor);
                    vec3 finalColor = mix(vec3(0.08, 0.03, 0.01), uGlowColor, sunBlend);

                    gl_FragColor = vec4(finalColor * intensity, intensity * 0.35);
                }
            `
        });

        const atmosGlow = new THREE.Mesh(
            new THREE.SphereGeometry(2.08, 64, 64),
            atmosGlowMaterial
        );
        atmosGlow.scale.set(1.0, 0.99665, 1.0);
        earthGroup.add(atmosGlow);

        // ────── Star Field (twinkling) ──────
        const starCount = 6000;
        const starGeom = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        const starPhases = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            const r = 40 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = r * Math.cos(phi);
            starSizes[i] = 0.5 + Math.random() * 2.0;
            starPhases[i] = Math.random() * Math.PI * 2;
        }

        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeom.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));
        starGeom.setAttribute('aPhase', new THREE.BufferAttribute(starPhases, 1));

        const starMaterial = new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() },
            },
            vertexShader: `
                attribute float aSize;
                attribute float aPhase;
                uniform float uTime;
                uniform float uPixelRatio;
                varying float vTwinkle;
                void main() {
                    vTwinkle = 0.5 + 0.5 * sin(uTime * 0.8 + aPhase);
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = aSize * uPixelRatio * (80.0 / -mvPos.z);
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                varying float vTwinkle;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float glow = 1.0 - smoothstep(0.0, 0.5, dist);
                    glow = pow(glow, 1.5);
                    float alpha = glow * (0.5 + 0.5 * vTwinkle);
                    vec3 color = mix(vec3(0.8, 0.85, 1.0), vec3(1.0, 0.95, 0.8), vTwinkle);
                    gl_FragColor = vec4(color, alpha);
                }
            `
        });

        const stars = new THREE.Points(starGeom, starMaterial);
        scene.add(stars);

        // ────── Sun Light Direction ──────
        const sunSpherical = new THREE.Spherical(1, Math.PI / 2, -1.24);
        const sunVector = new THREE.Vector3();

        // ────── Animation Loop ──────
        let frameCount = 0, lastHudTime = 0;
        const clock = new THREE.Clock();

        function animate(time) {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Earth rotation
            if (config.autoRotate) {
                earth.rotation.y += config.rotationSpeed;
                cloudMesh.rotation.y += config.rotationSpeed + config.cloudSpeed;
            }

            // Sun animation
            if (config.sunAnimSpeed > 0) {
                sunSpherical.theta += config.sunAnimSpeed * 0.01;
            }

            // Update sun direction for all materials
            sunVector.setFromSpherical(sunSpherical);
            earthMaterial.uniforms.uSunDirection.value.copy(sunVector);
            cloudMaterial.uniforms.uSunDirection.value.copy(sunVector);
            atmosGlowMaterial.uniforms.uSunDirection.value.copy(sunVector);

            // Star twinkle
            starMaterial.uniforms.uTime.value = elapsed;

            // OrbitControls update
            controls.update();

            renderer.render(scene, camera);

            // FPS counter
            frameCount++;
            if (time > lastHudTime + 1000) {
                const fps = Math.round(frameCount * 1000 / (time - lastHudTime));
                const monitor = document.getElementById('fps-monitor');
                if (monitor) monitor.innerText = `FPS: ${fps}`;
                frameCount = 0;
                lastHudTime = time;
            }
        }

        // ────── GUI Controls ──────
        try {
            const gui = new lil.GUI({ title: 'Earth Controls', width: 280 });

            // Earth folder
            const earthFolder = gui.addFolder('Earth');
            earthFolder.add(config, 'rotationSpeed', 0, 0.05, 0.0001).name('Rotation Speed');
            earthFolder.add(config, 'axialTilt', 0, 45, 0.1).name('Axial Tilt (°)').onChange(v => {
                earthGroup.rotation.z = v * Math.PI / 180;
            });
            earthFolder.add(config, 'autoRotate').name('Auto Rotate');

            // Sun folder
            const sunFolder = gui.addFolder('Sun');
            sunFolder.add(sunSpherical, 'theta', -Math.PI, Math.PI, 0.01).name('Sun Longitude');
            sunFolder.add(sunSpherical, 'phi', 0.01, Math.PI, 0.01).name('Sun Latitude');
            sunFolder.add(config, 'sunIntensity', 0.5, 3.0, 0.05).name('Sun Intensity').onChange(v => {
                earthMaterial.uniforms.uSunIntensity.value = v;
            });
            sunFolder.add(config, 'sunAnimSpeed', 0, 5, 0.1).name('Sun Animation');

            // Atmosphere folder
            const atmosFolder = gui.addFolder('Atmosphere');
            atmosFolder.addColor(config, 'atmosDayColor').name('Day Color').onChange(v => {
                earthMaterial.uniforms.uAtmosphereDayColor.value.set(v);
                atmosGlowMaterial.uniforms.uGlowColor.value.set(v);
            });
            atmosFolder.addColor(config, 'atmosTwilightColor').name('Twilight Color').onChange(v => {
                earthMaterial.uniforms.uAtmosphereTwilightColor.value.set(v);
            });
            atmosFolder.add(config, 'atmosIntensity', 0, 2, 0.05).name('Intensity').onChange(v => {
                earthMaterial.uniforms.uAtmosIntensity.value = v;
            });
            atmosFolder.add(config, 'glowStrength', 0, 2, 0.05).name('Glow Strength').onChange(v => {
                atmosGlowMaterial.uniforms.uGlowStrength.value = v;
            });

            // Clouds folder
            const cloudFolder = gui.addFolder('Clouds');
            cloudFolder.add(config, 'showClouds').name('Visible').onChange(v => {
                cloudMesh.visible = v;
            });
            cloudFolder.add(config, 'cloudOpacity', 0, 1, 0.01).name('Opacity').onChange(v => {
                cloudMaterial.uniforms.uOpacity.value = v;
            });
            cloudFolder.add(config, 'cloudSpeed', 0, 0.005, 0.0001).name('Drift Speed');

            // Surface folder
            const surfaceFolder = gui.addFolder('Surface');
            surfaceFolder.add(config, 'normalStrength', 0, 3, 0.05).name('Normal Strength').onChange(v => {
                earthMaterial.uniforms.uNormalStrength.value = v;
            });

            // Camera folder
            const cameraFolder = gui.addFolder('Camera');
            cameraFolder.add(config, 'cameraFov', 20, 90, 1).name('Field of View').onChange(v => {
                camera.fov = v;
                camera.updateProjectionMatrix();
            });
            cameraFolder.add({
                reset: () => {
                    camera.position.set(0, 0.5, 5.5);
                    controls.target.set(0, 0, 0);
                    controls.update();
                }
            }, 'reset').name('Reset Camera');

            // Open earth folder by default
            earthFolder.open();

        } catch (e) {
            console.warn('GUI failed to initialize:', e);
        }

        // Start animation
        animate(0);

        // ────── Responsive ──────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>

</html>
